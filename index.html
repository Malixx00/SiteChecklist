<!doctype html>
<html lang="en-AU" data-theme="light" data-sun="off">
<head>
  <meta charset="utf-8">
  <title>Site Reporter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#425563">
  <meta name="description" content="Australian Turntables site inspection checklists for field technicians.">
  <meta name="color-scheme" content="light dark">

  <!-- iOS Home Screen web app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Site Reporter">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/at-symbol.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">

  <!-- Preloaded so brand type is in place for the first paint rather than
       swapping in after it. -->
  <link rel="preload" href="fonts/montserrat-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-condensed-700-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="update-banner" class="updatebanner" role="status" hidden></div>

  <div id="app">
    <div class="screen">
      <main class="page"><p class="empty">Loading Site Reporter…</p></main>
    </div>
  </div>

  <div id="toast-host" class="toast-host"></div>
  <div id="dialog-host"></div>

  <noscript>
    <p style="padding:24px;font:16px system-ui">
      Site Reporter needs JavaScript. Enable it in your browser settings and reload this page.
    </p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
